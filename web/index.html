<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRESUI</title>
    <script>
      // The theme lives in the backend's settings, which arrive over RPC long
      // after first paint — so the page used to be hard-coded dark and a light
      // user got a dark flash on every load, plus an <html> that stayed dark
      // behind the app (visible on overscroll). Mirror the choice into
      // localStorage and apply it here, before anything is painted.
      (function () {
        var t = "dark";
        try {
          var saved = localStorage.getItem("gresui.theme");
          if (saved === "light" || saved === "dark") t = saved;
        } catch (e) {
          // private mode / blocked storage — dark is the app default
        }
        var el = document.documentElement;
        if (t === "dark") el.classList.add("dark");
        el.style.colorScheme = t;
      })();
    </script>
    <style>
      /* Pre-mount canvas; must match --bg in src/index.css for both themes. */
      html {
        background: #ffffff;
      }
      html.dark {
        background: #12151b;
      }
    </style>
    <style>
      /* Splash shown until React mounts; removed automatically on render. */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #12151b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
      }
      .dark #splash {
        background: #12151b;
        color: #dde1e6;
      }
      #splash .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #13aa52;
      }
      #splash .bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: #e4e7ec;
        overflow: hidden;
      }
      .dark #splash .bar {
        background: #2b323d;
      }
      #splash .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #13aa52;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="logo">GRESUI</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
